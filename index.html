<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Andy’s Goals</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Andy’s Goals</h1>
        <p>AI Personal Learning Hub</p>
      </div>
      <span class="badge">AI</span>
    </header>

    <nav class="nav">
      <button onclick="showPage('heli')">🚁 Helicopter</button>
      <button onclick="showPage('spanish')">🇪🇸 Spanish</button>
      <button onclick="showPage('invest')">📈 Investing</button>
      <button onclick="showPage('tutor')">🤖 AI Tutor</button>
    </nav>

    <section id="heli" class="page active">
      <h2>🚁 Helicopter Academy</h2>
      <p>從零開始，由 AI 即時生成課程與複習題。</p>
      <select id="chapter"></select>
      <div class="actions">
        <button class="primary" onclick="generateLesson()">Generate Lesson</button>
        <button onclick="generateQuiz()">Generate Quiz</button>
      </div>
      <article id="heliOut" class="output">選擇章節後開始。</article>
    </section>

    <section id="spanish" class="page">
      <h2>🇪🇸 Spanish Academy</h2>
      <p>每週 4 天、每天 10 個單字，從零開始。</p>
      <button class="primary" onclick="generateSpanish()">Generate Today’s 10 Words</button>
      <article id="spanishOut" class="output">今天的課程會由 AI 生成。</article>
    </section>

    <section id="invest" class="page">
      <h2>📈 Investing</h2>
      <p>投資學習區正在建置中。</p>
    </section>

    <section id="tutor" class="page">
      <h2>🤖 AI Tutor</h2>
      <textarea id="question" placeholder="例如：什麼是 Translational Lift？"></textarea>
      <button class="primary" onclick="askTutor()">Ask AI</button>
      <article id="tutorOut" class="output"></article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
